version: 2
updates:
  # The repository has no package manifest: it ships Markdown and JSON. The only
  # dependencies it has are the actions used by the workflows, pinned to a full
  # commit SHA, which Dependabot updates while keeping the pin.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        update-types:
          - "minor"
          - "patch"
